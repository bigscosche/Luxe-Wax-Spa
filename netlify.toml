[build]
  publish  = "."
  # Generate config.local.js from SUPABASE_URL / SUPABASE_ANON_KEY env vars
  # before the site is published. See scripts/build-config.sh.
  command  = "bash scripts/build-config.sh"

# Hourly run — 24h reminders, post-visit thanks, rebook nudges, low-stock alerts.
[functions."scheduled-reminders"]
  schedule = "0 * * * *"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co;"

